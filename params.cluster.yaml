# Example parameters for -profile cluster.
# Copy this file, edit the paths, and pass it with -params-file.
#
# You should only need a samplesheet to run the pipeline. If you don't have one,
# set fastq_dir + reference_genome instead and the pipeline will build it.

# Path to a CSV with columns: sample,R1,R2,reference
samplesheet: null

# Where published results go
outdir: './results'

# If you don't have a samplesheet, specify a fastq dir and a reference genome.
# reference_genome is resolved relative to reference_dir.
fastq_dir: null
reference_genome: null

# Directory holding all the reference genomes. The samplesheet 'reference'
# column is resolved relative to this.
reference_dir: null

# Read trimming: 'fastp' or 'cutadapt'
trimmer: 'fastp'

# Alignment
alignment:
  device: 'cpu' # 'cpu' for bwa+samtools, 'gpu' for Parabricks

# Set to true to skip variant calling altogether: no BCF, VCF, CSV or
# consensus output, whatever variant_callers says below. Use it when you only
# want trimming, QC, alignment and coverage tracks.
skip_variant_calling: false

# Variant calling: any of bcftools, deepvariant, mutect2
# Ignored when skip_variant_calling is true.
variant_callers:
  - bcftools
  - deepvariant
#  - mutect2

# Variant filtering thresholds
min_mapq: 20
min_qual: 20
ploidy: 1
min_depth: 10

# Directory holding the UCSC binaries (bedGraphToBigWig), for -profile local.
# Leave null when the bedtools container provides them.
ucsc_dir: null
