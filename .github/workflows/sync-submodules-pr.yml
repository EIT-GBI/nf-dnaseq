name: Sync submodule pointers on the PR

# A PR that changes modules.versions (Renovate's feat(deps) PRs, or a
# person's) must move the matching submodule in the same PR. Otherwise CI
# tests the OLD module version, and the merge releases a pipeline whose
# modules.versions and submodule pointers disagree.
#
# This moves the submodules on the PR branch itself, so CI runs against the
# new module version and the merge carries both together. The required
# "Submodules match modules.versions" check in ci.yml keeps the PR from
# merging until it has.
#
# The commit message deliberately starts with neither `feat(deps)` nor
# `chore(submodules)`: those prefixes start sync-submodules.yml and
# auto-release.yml on main, which would cut a second release after
# release.yml has released the merged PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'modules.versions'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # Branches in this repo only: a fork's PR gets no secrets, and we never
    # push to someone else's fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Token for the eit-gbi-release-bot GitHub App. A push made with it
      # triggers CI on the new commit, which a GITHUB_TOKEN push would not.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout the PR branch (with submodules)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      # Renovate ignores commits by this author when deciding whether someone
      # else has edited its branch (gitIgnoredAuthors in nf-renovate-config),
      # so it keeps rebasing and automerging the PR.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move submodules to the versions in modules.versions
        id: sync
        run: bash .github/scripts/sync_submodules.sh

      - name: Commit and push to the PR branch
        if: steps.sync.outputs.changed == '1'
        run: |
          git commit -m "build(submodules): move pointers to match modules.versions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
